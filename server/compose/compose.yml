# Tortugarr server stack.
#
# Do not edit this file in an installed copy - it is regenerated by `tortugarr repair`
# and `tortugarr update`. Put local changes in overrides/local.yml, which is kept.
#
# All values come from the .env file next to it. Optional parts are switched on
# with Compose profiles (COMPOSE_PROFILES in .env):
#   qbittorrent | transmission | deluge   - the torrent client (at most one)
#   sabnzbd                               - usenet client
#   vpn                                   - gluetun; see overrides/vpn.yml

name: tortugarr

x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}
  UMASK: "002"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jellyfin:
    image: ${IMAGE_JELLYFIN}
    container_name: tortugarr-jellyfin
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: http://${LAN_IP}:${JELLYFIN_PORT}
    volumes:
      - ${TORTUGARR_CONFIG}/jellyfin:/config
      - ${TORTUGARR_CONFIG}/jellyfin-cache:/cache
      - ${TORTUGARR_DATA}/media:/data/media:ro
    ports:
      - ${BIND_IP}:${JELLYFIN_PORT}:8096
    logging: *logging

  sonarr:
    image: ${IMAGE_SONARR}
    container_name: tortugarr-sonarr
    restart: unless-stopped
    environment: *common-env
    volumes:
      - ${TORTUGARR_CONFIG}/sonarr:/config
      - ${TORTUGARR_DATA}:/data
    ports:
      - ${BIND_IP}:${SONARR_PORT}:8989
    logging: *logging

  radarr:
    image: ${IMAGE_RADARR}
    container_name: tortugarr-radarr
    restart: unless-stopped
    environment: *common-env
    volumes:
      - ${TORTUGARR_CONFIG}/radarr:/config
      - ${TORTUGARR_DATA}:/data
    ports:
      - ${BIND_IP}:${RADARR_PORT}:7878
    logging: *logging

  prowlarr:
    image: ${IMAGE_PROWLARR}
    container_name: tortugarr-prowlarr
    restart: unless-stopped
    environment: *common-env
    volumes:
      - ${TORTUGARR_CONFIG}/prowlarr:/config
    ports:
      - ${BIND_IP}:${PROWLARR_PORT}:9696
    logging: *logging

  bazarr:
    # Subtitles. Same /data mount as Sonarr/Radarr, so their file paths work as-is.
    image: ${IMAGE_BAZARR}
    container_name: tortugarr-bazarr
    restart: unless-stopped
    environment: *common-env
    volumes:
      - ${TORTUGARR_CONFIG}/bazarr:/config
      - ${TORTUGARR_DATA}:/data
    ports:
      - ${BIND_IP}:${BAZARR_PORT}:6767
    logging: *logging

  seerr:
    image: ${IMAGE_SEERR}
    container_name: tortugarr-seerr
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    volumes:
      - ${TORTUGARR_CONFIG}/seerr:/app/config
    ports:
      - ${BIND_IP}:${SEERR_PORT}:5055
    logging: *logging

  flaresolverr:
    # Only Prowlarr talks to it, container to container - never published.
    image: ${IMAGE_FLARESOLVERR}
    container_name: tortugarr-flaresolverr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    logging: *logging

  qbittorrent:
    profiles: [qbittorrent]
    image: ${IMAGE_QBITTORRENT}
    container_name: tortugarr-qbittorrent
    restart: unless-stopped
    environment:
      <<: *common-env
      WEBUI_PORT: "8080"
      TORRENTING_PORT: ${TORRENT_PEER_PORT}
    volumes:
      - ${TORTUGARR_CONFIG}/qbittorrent:/config
      - ${TORTUGARR_DATA}/torrents:/data/torrents
      # The adult library's folder (Tortugarr plugin, off until an administrator switches it on).
      - ${TORTUGARR_DATA}/media/adult:/data/media/adult
    ports:
      - ${BIND_IP}:${TORRENT_WEB_PORT}:8080
      - ${TORRENT_PEER_PORT}:${TORRENT_PEER_PORT}
      - ${TORRENT_PEER_PORT}:${TORRENT_PEER_PORT}/udp
    logging: *logging

  transmission:
    profiles: [transmission]
    image: ${IMAGE_TRANSMISSION}
    container_name: tortugarr-transmission
    restart: unless-stopped
    environment:
      <<: *common-env
      USER: ${TORRENT_USER}
      PASS: ${TORRENT_PASSWORD}
      PEERPORT: ${TORRENT_PEER_PORT}
    volumes:
      - ${TORTUGARR_CONFIG}/transmission:/config
      - ${TORTUGARR_DATA}/torrents:/data/torrents
    ports:
      - ${BIND_IP}:${TORRENT_WEB_PORT}:9091
      - ${TORRENT_PEER_PORT}:${TORRENT_PEER_PORT}
      - ${TORRENT_PEER_PORT}:${TORRENT_PEER_PORT}/udp
    logging: *logging

  deluge:
    profiles: [deluge]
    image: ${IMAGE_DELUGE}
    container_name: tortugarr-deluge
    restart: unless-stopped
    environment:
      <<: *common-env
      DELUGE_LOGLEVEL: error
    volumes:
      - ${TORTUGARR_CONFIG}/deluge:/config
      - ${TORTUGARR_DATA}/torrents:/data/torrents
    ports:
      - ${BIND_IP}:${TORRENT_WEB_PORT}:8112
      - ${TORRENT_PEER_PORT}:${TORRENT_PEER_PORT}
      - ${TORRENT_PEER_PORT}:${TORRENT_PEER_PORT}/udp
    logging: *logging

  sabnzbd:
    profiles: [sabnzbd]
    image: ${IMAGE_SABNZBD}
    container_name: tortugarr-sabnzbd
    restart: unless-stopped
    environment: *common-env
    volumes:
      - ${TORTUGARR_CONFIG}/sabnzbd:/config
      - ${TORTUGARR_DATA}/usenet:/data/usenet
    ports:
      - ${BIND_IP}:${SABNZBD_PORT}:8080
    logging: *logging

networks:
  default:
    name: tortugarr
