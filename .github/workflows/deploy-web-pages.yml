name: Deploy Web To GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Build web
        run: |
          flutter pub get
          flutter build web --wasm --release --base-href "/${{ github.event.repository.name }}/"

      - name: Write Pages runtime config
        run: |
          cat > build/web/config.json <<'EOF'
          {
            "schemaVersion": 1,
            "defaultServerUrl": null,
            "discoveryProxyUrl": null,
            "enableWebRtcScan": true,
            "brandingName": "Moonfin",
            "pluginMode": false,
            "forcedServerUrl": null
          }
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
