<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<!-- Books can only use what epub.js unpacked into blob URLs, so nothing in one can reach the network.
     Only scripts carrying this page's nonce run, so a book's own scripts never do. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{nonce}}'; style-src 'unsafe-inline' blob: data:; img-src blob: data:; font-src blob: data:; media-src blob: data:; frame-src about: blob: data:; connect-src blob: data:">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; }
#frame { box-sizing: border-box; height: 100%; margin: 0 auto; }
#reader { width: 100%; height: 100%; }
</style>
<!--scripts-->
</head>
<body><div id="frame"><div id="reader"></div></div></body>
</html>
